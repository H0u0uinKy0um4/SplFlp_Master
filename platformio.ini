; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 115200
monitor_speed = 115200
build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DWEBSERIAL_MDNS_HOSTNAME=\"splitflap\"
monitor_rts = 0
monitor_dtr = 0
monitor_filters = send_on_enter, default
monitor_echo = yes
monitor_eol = LF
lib_deps = 
	; Web serial console (HTTP + WebSocket + source tagging). It brings its
	; own WebSockets dependency. The tag pins the released library version;
	; publish it to the PlatformIO Registry to use the short form
	; "H0u0uinKy0um4/WebSerialConsole @ ^1.1.1" instead.
	https://github.com/H0u0uinKy0um4/WebSerialConsole.git#v1.1.1
	knolleary/PubSubClient@^2.8
	etlcpp/Embedded Template Library
	bblanchon/ArduinoJson@^7.2.2

upload_protocol = espota
upload_port = 10.0.1.15
upload_flags = 
	--auth=80085
	--port=3232
	--host_ip=10.0.1.13
	--host_port=40000
